apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.38.0 (a8f5d1cbd)
  labels:
    io.kompose.service: roblox-service
  name: roblox-service
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: roblox-service
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.38.0 (a8f5d1cbd)
      labels:
        io.kompose.service: roblox-service
    spec:
      containers:
        - envFrom:
            - configMapRef:
                name: services-roblox-service--env
          image: roblox-service
          name: roblox-service
          ports:
            - containerPort: 7102
              protocol: TCP
          stdin: true
          tty: true
      restartPolicy: Always
